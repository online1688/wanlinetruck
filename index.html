        function renderVehicles(list) {
            const grid = document.getElementById('vehicle-grid');
            grid.innerHTML = '';

            list.forEach(car => {

                    thumbHtml = car.images.map((img, idx) => `
                        <img src="${img}" 
                             onclick="changeCarPhoto('${car.id}', ${idx})" 
                             class="w-14 h-11 object-cover rounded-lg border-2 ${idx === currentPhotoIndexMap[car.id] ? 'border-brand scale-105 shadow-sm' : 'border-transparent opacity-70 hover:opacity-100'} hover:border-brand cursor-pointer transition-all shrink-0 thumb-${car.id}"

                }

                const tagsHtml = car.tags.map(tag => 
                    `<span class="text-xs px-2 py-1 rounded-md ${tag.class}">${tag.text}</span>`
                ).join('');

                card.innerHTML = `
                    <!-- 主圖區 -->
                    <div class="relative bg-gray-100">
                        <div class="h-56 overflow-hidden cursor-zoom-in" onclick="openLightbox('${car.id}')">

                            <i class="ph ph-magnifying-glass-plus"></i> 放大 (${car.images.length}張)

                    </div>

                        </div>
                    ` : ''}

                    <div class="p-6 flex-grow flex flex-col">
                        <h3 class="text-2xl font-bold text-dark mb-2">${car.name}</h3>
                        <div class="flex flex-wrap gap-2 mb-3">
                            ${tagsHtml}
                        </div>
                        ${specsHtml}
                        <p class="text-gray-600 text-sm flex-grow mb-6 leading-relaxed">${car.desc}</p>

                                <span class="font-bold base text-gray-700">+ NT$ ${car.prices.p_add}</span>
                            </div>
                            <div class="flex justify-between items-center text-sm mt-1">
                                <span class="text-gray-500">日租 (10-24小時)</span>
                                <span class="font-bold text-lg text-brand">NT$ ${car.prices.p_day}</span>

        function changeCarPhoto(carId, index) {
            const car = vehiclesData.find(v => v.id === carId);
            if (!car) return;
            currentPhotoIndexMap[carId] = index;
            document.getElementById(`main-img-${carId}`).src = car.images[index];

            const thumbs = document.querySelectorAll(`.thumb-${carId}`);
            thumbs.forEach((t, idx) => {
                if (idx === index) {
                    t.className = `w-14 h-11 object-cover rounded-lg border-2 border-brand scale-105 shadow-sm cursor-pointer transition-all shrink-0 thumb-${carId}`;
                } else {
                    t.className = `w-14 h-11 object-cover rounded-lg border-2 border-transparent opacity-70 hover:opacity-100 hover:border-brand cursor-pointer transition-all shrink-0 thumb-${carId}`;
                }
            });
        }

        function filterVehicles(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-6 py-2.5 rounded-xl text-sm sm:text-base font-bold text-gray-500 hover:text-dark transition-all";
            });
            document.getElementById(`btn-${type}`).className = "filter-btn px-6 py-2.5 rounded-xl text-sm sm:text-base font-bold bg-white text-dark shadow-sm transition-all";

            if (type === 'all') {
                renderVehicles(vehiclesData);
            } else {
                renderVehicles(vehiclesData.filter(v => v.type === type));
            }
        }

        let activeLightboxCar = null;
        let activeLightboxIndex = 0;

        function openLightbox(carId) {
            const car = vehiclesData.find(v => v.id === carId);
            if (!car) return;

            activeLightboxCar = car;
            activeLightboxIndex = currentPhotoIndexMap[carId] || 0;

            updateLightboxView();
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function updateLightboxView() {
            if (!activeLightboxCar) return;
            const images = activeLightboxCar.images;
            const imgEl = document.getElementById('lightbox-img');
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');
            const counter = document.getElementById('lightbox-counter');
            const thumbsContainer = document.getElementById('lightbox-thumbs');

            imgEl.src = images[activeLightboxIndex];

            if (images.length > 1) {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                counter.classList.remove('hidden');
                counter.textContent = `${activeLightboxIndex + 1} / ${images.length}`;
                
                // 渲染燈箱底部小縮圖列
                thumbsContainer.classList.remove('hidden');
                thumbsContainer.innerHTML = images.map((img, idx) => `
                    <img src="${img}" 
                         onclick="selectLightboxThumb(${idx}, event)" 
                         class="w-16 h-12 object-cover rounded-lg border-2 ${idx === activeLightboxIndex ? 'border-brand scale-110 opacity-100 shadow-md' : 'border-transparent opacity-50 hover:opacity-90'} cursor-pointer transition-all shrink-0"
                         alt="燈箱縮圖">
                `).join('');
            } else {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                counter.classList.add('hidden');
                thumbsContainer.classList.add('hidden');
            }
        }

        function selectLightboxThumb(index, event) {
            if (event) event.stopPropagation();
            if (!activeLightboxCar) return;
            activeLightboxIndex = index;
            changeCarPhoto(activeLightboxCar.id, activeLightboxIndex);
            updateLightboxView();
        }

        function changeLightboxImage(step, event) {
            if (event) event.stopPropagation();
            if (!activeLightboxCar || activeLightboxCar.images.length <= 1) return;

            const total = activeLightboxCar.images.length;
            activeLightboxIndex = (activeLightboxIndex + step + total) % total;
            
            changeCarPhoto(activeLightboxCar.id, activeLightboxIndex);
            updateLightboxView();
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
            activeLightboxCar = null;
        }

        document.getElementById('lightbox-modal').addEventListener('click', function(e) {
            if (e.target.id === 'lightbox-modal') {
                closeLightbox();
            }
        });

        window.addEventListener('keydown', function(e) {
            if (!activeLightboxCar) return;
            if (e.key === 'ArrowLeft') changeLightboxImage(-1);
            if (e.key === 'ArrowRight') changeLightboxImage(1);
            if (e.key === 'Escape') closeLightbox();
        });

        function navigate(pageId) {
            const pages = document.querySelectorAll('.page-section');
            pages.forEach(page => {
                page.classList.add('hidden');
                page.classList.remove('animate-fadeIn');
            });

            const targetPage = document.getElementById('page-' + pageId);
            if (targetPage) {
                targetPage.classList.remove('hidden');
                void targetPage.offsetWidth; 
                targetPage.classList.add('animate-fadeIn');
            }

            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                if(link.dataset.target === pageId) {
                    link.classList.add('active', 'text-brand');
                    link.classList.remove('text-gray-600');
                } else {
                    link.classList.remove('active', 'text-brand');
                    link.classList.add('text-gray-600');
                }
            });

            window.location.hash = pageId;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('load', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash && document.getElementById('page-' + hash)) {
                navigate(hash);
            } else {
                navigate('home');
            }
            
            renderVehicles(vehiclesData);
        });

        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 10) {
                navbar.classList.add('shadow-sm');
                navbar.classList.replace('bg-white/90', 'bg-white/95');
            } else {
                navbar.classList.remove('shadow-sm');
                navbar.classList.replace('bg-white/95', 'bg-white/90');
            }
        });
    </script>
</body>
</html>
